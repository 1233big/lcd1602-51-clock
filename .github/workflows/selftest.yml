name: 自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行 8051 模拟器自检
        run: |
          out=$(python -I build_lcd.py)
          echo "$out"
          echo "$out" | grep -q "checks OK"
          echo "$out" | grep -q "lines on LCD: \['Claude', 'LCD1602 OK'\]"
